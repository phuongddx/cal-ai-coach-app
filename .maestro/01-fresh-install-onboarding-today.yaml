# U-82 flow 01 — a fresh install shows onboarding, then the seeded Today.
# Mirrors scripts/rn/evidence/flows/01-first-launch.sh and 03-today-seeded.sh: no target stored,
# so the gate shows the onboarding hero ("Track calories with a photo", the "Get started" button);
# coachcal://debug?action=seed writes the demo persona (its target moves the gate to the shell).
appId: com.nextlabs.coachcal
name: 01 fresh install shows onboarding, then the seeded Today
---
- launchApp:
    appId: com.nextlabs.coachcal
    clearState: true
- openLink: exp+coachcal://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
# The system asks "Open in CoachCal?" for every simctl openurl of a custom scheme; the evidence
# harness taps it away the same way (lib.sh dismiss_open_dialog).
- tapOn:
    text: "^Open$"
    optional: true
# The first load compiles the whole Metro bundle on a cold runner; five minutes is the ceiling.
- extendedWaitUntil:
    visible: "Track calories with a photo"
    timeout: 300000
- assertVisible: "Get started"
- takeScreenshot: 01-onboarding-fresh-install

- openLink: coachcal://debug?action=seed
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Debug console"
    timeout: 30000
- openLink: coachcal:///
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Chicken rice bowl"
    timeout: 60000
- takeScreenshot: 01-today-seeded
