# U-82 flow 03 — the scan fixture recomputes kcal from the grams.
# The workflow launches the app with `simctl launch <udid> com.nextlabs.coachcal
# --ccScanScenario 200` (the evidence harness's way: process arguments reach the native
# launch-arguments module), so this flow only opens the dev client URL.
#
# The scenario is the golden response: one item at 320 g and 145 kcal per 100 g, so the review
# reads 464. Three taps on the stepper's plus button add 30 g; the row then reads
# 350 x 145 / 100 = 507.5, rounded half-up to 508 — the recomputed figure, never 464 again
# (the rule scanKcalParity.test.ts proves). Every step addresses an identifier or a text, never
# a pixel: scan.shutter, ccstepper.increment (the design Stepper's plus button inside the
# scan.grams wrapper), asserted through the review's kcal texts.
appId: com.nextlabs.coachcal
name: 03 the scan fixture recomputes kcal from the grams
---
- openLink: exp+coachcal://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 180000

- openLink: coachcal://scan
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Scan Food"
    timeout: 30000
- takeScreenshot: 03-scan-capture
- tapOn:
    id: "scan.shutter"
- extendedWaitUntil:
    visible: "Review"
    timeout: 30000
- assertVisible: "464 kcal"
- takeScreenshot: 03-scan-review-464

- tapOn:
    id: "ccstepper.increment"
- tapOn:
    id: "ccstepper.increment"
- tapOn:
    id: "ccstepper.increment"
- assertVisible: "508 kcal"
- assertNotVisible: "464 kcal"
- takeScreenshot: 03-scan-review-508
