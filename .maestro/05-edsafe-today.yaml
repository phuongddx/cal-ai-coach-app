# U-82 flow 05 — a launch with --ccEDSafe shows no calorie number on Today.
# The workflow launches the app with `simctl launch <udid> com.nextlabs.coachcal --ccEDSafe`
# (the evidence harness's way), so this flow only opens the dev client URL. The seeded meal row
# keeps its title, and its kcal clause (food-row-kcal:Spaghetti Bolognese, visible on the flow 03
# Today screenshot) is gone: no calorie figure is on screen.
appId: com.nextlabs.coachcal
name: 05 a launch with --ccEDSafe shows no calorie number on Today
---
- openLink: exp+coachcal://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- tapOn:
    text: "^Open$"
    optional: true
- scrollUntilVisible:
    element: "Spaghetti Bolognese"
    direction: DOWN
    timeout: 120000
- assertVisible: "Spaghetti Bolognese"
- assertNotVisible:
    id: "food-row-kcal:Spaghetti Bolognese"
- takeScreenshot: 05-today-edsafe
