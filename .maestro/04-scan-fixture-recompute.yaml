# U-82 flow 04 — the scan fixture recomputes kcal from the grams.
# The workflow launches the app with `simctl launch <udid> com.nextlabs.coachcal
# --ccScanScenario 200` (the evidence harness's way: process arguments reach the native
# launch-arguments module), so this flow only opens the dev client URL.
#
# The scenario is the golden response: one item at 320 g and 145 kcal per 100 g, so the review
# reads 464. Three taps on the GramsField plus button (scan.grams.0.increment) add 30 g; the
# row then reads 350 x 145 / 100 = 507.5, rounded half-up to 508 — the recomputed figure, never
# 464 again (the rule scanKcalParity.test.ts proves). Every step addresses an identifier or a
# text, never a pixel: scan.shutter, scan.grams.0.increment, asserted through the review's
# kcal texts (scan.itemKcal.<id>).
appId: com.nextlabs.coachcal
name: 04 the scan fixture recomputes kcal from the grams
---
- openLink: exp+coachcal://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 180000

- openLink: coachcal://scan
- tapOn:
    text: "^Open$"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scan.shutter"
    timeout: 30000
- takeScreenshot: 04-scan-capture
- tapOn:
    id: "scan.shutter"
- extendedWaitUntil:
    visible: "Review"
    timeout: 30000
- assertVisible: "464 kcal"
- takeScreenshot: 04-scan-review-464

- tapOn:
    id: "scan.grams.0.increment"
- tapOn:
    id: "scan.grams.0.increment"
- tapOn:
    id: "scan.grams.0.increment"
- assertVisible: "508 kcal"
- assertNotVisible: "464 kcal"
- takeScreenshot: 04-scan-review-508
