name: CoachCal
options:
  bundleIdPrefix: com.nextlabs
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: K2TYLYAWMK
    CODE_SIGN_IDENTITY: "iPhone Distribution: Doan Duy Phuong (K2TYLYAWMK)"
packages:
  CoachCalCore:
    path: Modules/CoachCalCore
  CoachCalDesignSystem:
    path: Modules/CoachCalDesignSystem
  CoachCalPersistence:
    path: Modules/CoachCalPersistence
  CoachCalNetworking:
    path: Modules/CoachCalNetworking
  CoachCalSync:
    path: Modules/CoachCalSync
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    exactVersion: 0.10.3
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.19.4"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.28.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.75.2
targets:
  CoachCal:
    type: application
    platform: iOS
    sources:
      - App/CoachCal
      - App/Features
    info:
      path: App/CoachCal/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.nextlabs.coachcal
            CFBundleURLSchemes:
              - coachcal
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        CFBundleDisplayName: CoachCal
        NSCameraUsageDescription: CoachCal uses the camera to photograph your meals so CoachCal can estimate calories and macros.
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: CoachCal reads your step count from Apple Health to show it on the Today screen and keep calorie estimates accurate.
        NSHealthUpdateUsageDescription: CoachCal saves burned-energy summaries to Apple Health only when you explicitly confirm them — never automatically from a scan.
        NSSupportsLiveActivities: true
        CFBundleVersion: "2"
        # Root cause of "app doesn't fill the real device screen" (black
        # letterbox bars top/bottom): without a UILaunchScreen dict (or a
        # legacy launch storyboard), iOS treats the app as not opted into
        # the current device's native screen and runs it in scaled
        # compatibility mode. An empty dict is Apple's documented minimal
        # opt-in (system-generated blank launch screen, full native size).
        UILaunchScreen: {}
    dependencies:
      - package: CoachCalCore
      - package: CoachCalDesignSystem
      - package: CoachCalPersistence
      - package: CoachCalNetworking
      - package: CoachCalSync
      - package: Sentry
      - package: PostHog
      - target: CoachCalWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.coachcal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "iPhone Distribution: Doan Duy Phuong (K2TYLYAWMK)"
        CODE_SIGN_ENTITLEMENTS: App/CoachCal/SupportingFiles/CoachCal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: "CoachCal AppStore"
        SUPABASE_URL: "$(COACHCAL_SUPABASE_URL:http://127.0.0.1:54321)"
        SUPABASE_ANON_KEY: "$(COACHCAL_SUPABASE_ANON_KEY)"
        SENTRY_DSN: "$(COACHCAL_SENTRY_DSN:)"
        POSTHOG_API_KEY: "$(COACHCAL_POSTHOG_API_KEY:)"
  CoachCalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/CoachCalTests
      - CoachCalWidget/CaloriesRemainingTimelineProvider.swift
    dependencies:
      - target: CoachCal
      - package: ViewInspector
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.coachcal.unit-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CoachCal.app/CoachCal"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"
  CoachCalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/CoachCalUITests
    dependencies:
      - target: CoachCal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.coachcal.tests
        TEST_TARGET_NAME: CoachCal
        GENERATE_INFOPLIST_FILE: "YES"
        UI_TESTING: "YES"
  CoachCalWidget:
    type: app-extension
    platform: iOS
    sources:
      - CoachCalWidget
      - App/Features/LiveActivity/CoachCalLiveActivityAttributes.swift
    info:
      path: CoachCalWidget/Info.plist
      properties:
        CFBundleDisplayName: CoachCal Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: CoachCalDesignSystem
      - package: CoachCalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextlabs.coachcal.CoachCalWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CoachCalWidget/CoachCalWidget.entitlements
schemes:
  CoachCal:
    build:
      targets:
        CoachCal: all
        CoachCalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoachCalTests
        - CoachCalUITests
      # 04-07 E2ESyncConvergenceTests: xcodebuild test does not forward the
      # invoking shell's environment to a UI-test host process the way
      # `swift test` does — the scheme's own Test-action environment
      # variables are what XCUITest.ProcessInfo.processInfo.environment
      # actually sees. `$(...)` is resolved from the shell at `xcodegen
      # generate` time (never committed — CoachCal.xcodeproj is gitignored)
      # and becomes an empty string, never a missing key, when unset; the
      # test's own liveCredentialsConfigured gate treats blank as absent.
      environmentVariables:
        TEST_EMAIL: "$(TEST_EMAIL)"
        TEST_PASSWORD: "$(TEST_PASSWORD)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
