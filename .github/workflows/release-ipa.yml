name: Release IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DISTRIBUTION_P12_BASE64: ${{ secrets.COACHCAL_DISTRIBUTION_P12_BASE64 }}
      DISTRIBUTION_P12_PASSWORD: ${{ secrets.COACHCAL_DISTRIBUTION_P12_PASSWORD }}
      APP_PROFILE_BASE64: ${{ secrets.COACHCAL_APP_PROFILE_BASE64 }}
      WIDGET_PROFILE_BASE64: ${{ secrets.COACHCAL_WIDGET_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install Tuist
        run: |
          if ! command -v tuist >/dev/null 2>&1; then
            brew install tuist
          fi
          tuist version

      - name: Cache Tuist dependencies
        uses: actions/cache@v4
        with:
          path: |
            native/.tuist
            ~/.tuist
          key: release-tuist-${{ hashFiles('native/Tuist/Package.resolved') }}
          restore-keys: release-tuist-

      - name: Install signing assets
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/coachcal-build.keychain-db
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          p12="$RUNNER_TEMP/coachcal-distribution.p12"
          printf '%s' "$DISTRIBUTION_P12_BASE64" | base64 --decode > "$p12"
          security import "$p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$profile_dir/CoachCalAppStoreBuild4CI.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$profile_dir/CoachCalWidgetAppStoreBuild4CI.mobileprovision"

      - name: Generate Xcode project
        working-directory: native
        run: |
          tuist install
          tuist generate --no-open

      - name: Archive Release app
        working-directory: native
        run: |
          mkdir -p artifacts
          xcodebuild archive \
            -project CoachCal.xcodeproj \
            -scheme CoachCal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/artifacts/CoachCal-1.0-4.xcarchive" \
            archive

      - name: Export App Store IPA
        working-directory: native
        run: |
          cat > artifacts/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>K2TYLYAWMK</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution: Doan Duy Phuong (K2TYLYAWMK)</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nextlabs.coachcal</key>
              <string>CoachCal AppStore Build 4 CI</string>
              <key>com.nextlabs.coachcal.CoachCalWidget</key>
              <string>CoachCal Widget AppStore Build 4 CI</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint artifacts/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$PWD/artifacts/CoachCal-1.0-4.xcarchive" \
            -exportPath "$PWD/artifacts/export" \
            -exportOptionsPlist "$PWD/artifacts/ExportOptions.plist"
          test -f artifacts/export/CoachCal.ipa

      - name: Verify IPA
        working-directory: native
        run: |
          ./scripts/scan-ipa-secrets.sh artifacts/export/CoachCal.ipa
          ./scripts/check-artifact-compliance.sh artifacts/export/CoachCal.ipa
          verify_dir="$(mktemp -d)"
          unzip -q artifacts/export/CoachCal.ipa -d "$verify_dir"
          test "$(plutil -extract CFBundleVersion raw -o - "$verify_dir/Payload/CoachCal.app/Info.plist")" = "4"
          codesign --verify --deep --strict --verbose=2 "$verify_dir/Payload/CoachCal.app"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CoachCal-1.0-4-IPA
          path: native/artifacts/export/CoachCal.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Clean signing keychain
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/coachcal-build.keychain-db
        run: |
          if security list-keychains -d user >/dev/null 2>&1; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
