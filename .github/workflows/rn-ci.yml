name: RN CI

# TypeScript, Jest and the parity gate for the React Native app (apps/mobile), the Hono API
# (apps/api) and the shared packages. Runs on Ubuntu: nothing here needs Xcode. This is the only
# workflow; pull requests that only touch supabase/ or the Deno lockfile skip it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - 'deno.lock'
  pull_request:
    paths-ignore:
      - 'supabase/**'
      - 'deno.lock'
  workflow_dispatch:

concurrency:
  group: rn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Jest and parity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Parity gate
        run: npm run parity:check
